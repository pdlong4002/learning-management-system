server:
  port: 8080

spring:
  application:
    name: spring-boot-learning-management-system
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - user:email
              - read:user

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  auth:
    tokenSecret: ${JWT_SECRET}
    tokenExpiration: 900000 # 15 phút (ms)
    refreshTokenExpiration: 604800000 # 7 ngày (ms)
  cors:
    allowedOrigins: http://localhost:3000,http://localhost:5173
  oauth2:
    authorizedRedirectUris: http://localhost:3000/oauth2/redirect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/api/v1/payments/callback/vnpay
    version: "2.1.0"
    command: pay
    order-type: other
    expire-minutes: 15

  momo:
    partner-code: ${MOMO_PARTNER_CODE}
    access-key: ${MOMO_ACCESS_KEY}
    secret-key: ${MOMO_SECRET_KEY}
    endpoint: https://test-payment.momo.vn/v2/gateway/api/create
    return-url: http://localhost:3000/payment/result
    ipn-url: http://localhost:8080/api/v1/payments/callback/momo